formatters:
  enable:
    - gci
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/ArthurSens/maintainer-cockpit)
    gofumpt:
      extra:
        group-params: true
    goimports:
      local-prefixes:
        - github.com/ArthurSens/maintainer-cockpit

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  # Keep this list sorted alphabetically.
  enable:
    - depguard
    - errorlint
    - exptostd
    - fatcontext
    - gocritic
    - godot
    - govet
    - loggercheck
    - misspell
    - modernize
    - nilnesserr
    - perfsprint
    - predeclared
    - revive
    - sloglint
    - staticcheck
    - testifylint
    - unconvert
    - unused
    - usestdlibvars
    - whitespace

  exclusions:
    rules:
      - linters:
          - errcheck
        text: Error return value of .((os\.)?std(out|err)\..*|.*Close|.*Flush|os\.Remove(All)?|.*print(f|ln)?|os\.(Un)?Setenv). is not checked
      - linters:
          - revive
        text: exported (.+) should have comment( \(or a comment on this block\))? or be unexported
    warn-unused: true

  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: "github.com/stretchr/testify/assert"
              desc: "Use github.com/stretchr/testify/require instead of github.com/stretchr/testify/assert"
            - pkg: "github.com/pkg/errors"
              desc: "Use errors or fmt instead of github.com/pkg/errors"
            - pkg: "golang.org/x/exp/slices"
              desc: "Use slices instead."
            - pkg: "gopkg.in/yaml.v2"
              desc: "Use go.yaml.in/yaml/v2 instead of gopkg.in/yaml.v2"
            - pkg: "gopkg.in/yaml.v3"
              desc: "Use go.yaml.in/yaml/v3 instead of gopkg.in/yaml.v3"
            - pkg: "io/ioutil"
              desc: "Use corresponding os or io functions instead."
    errcheck:
      exclude-functions:
        - io.Copy
        - io.WriteString
        - (net/http.ResponseWriter).Write
        - (*net/http.Server).Shutdown
    gocritic:
      enable-all: true
      disabled-checks:
        - appendAssign
        - appendCombine
        - badLock
        - boolExprSimplify
        - commentedOutCode
        - deferInLoop
        - docStub
        - equalFold
        - evalOrder
        - exposedSyncMutex
        - hexLiteral
        - hugeParam
        - importShadow
        - ptrToRefParam
        - rangeValCopy
        - regexpSimplify
        - returnAfterHttpError
        - sloppyReassign
        - sprintfQuotedString
        - todoCommentWithoutDetail
        - tooManyResultsChecker
        - truncateCmp
        - typeDefFirst
        - typeUnparen
        - unlabelStmt
        - unnamedResult
        - unnecessaryBlock
        - unnecessaryDefer
        - whyNoLint
    govet:
      disable:
        - fieldalignment
        - shadow
      enable-all: true
    modernize:
      disable:
        - newexpr
        - omitzero
    perfsprint:
      concat-loop: false
      err-error: true
      errorf: true
      int-conversion: true
      sprintf1: true
      strconcat: false
    revive:
      enable-all-rules: false
      enable-default-rules: true
      max-open-files: 2048
      rules:
        - name: blank-imports
        - name: comment-spacings
        - name: context-as-argument
          arguments:
            - allowTypesBefore: '*testing.T,testing.TB'
        - name: context-keys-type
        - name: dot-imports
        - name: early-return
          arguments:
            - "preserveScope"
        - name: empty-block
          disabled: true
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
          arguments:
            - "preserveScope"
        - name: package-comments
          disabled: true
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
          arguments:
            - "preserveScope"
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: unused-receiver
        - name: var-declaration
        - name: var-naming
          arguments:
            - []
            - []
            - - skip-package-name-checks: true
    testifylint:
      disable:
        - float-compare
        - go-require
      enable-all: true

output:
  show-stats: false

run:
  timeout: 15m

version: "2"
