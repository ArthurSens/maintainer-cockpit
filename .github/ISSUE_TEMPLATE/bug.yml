name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels:
  - bug
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and am using the newest release.
          required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Paste the output of `maintainer-cockpit version`.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest configuration and steps that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Deployment environment
      description: Include OS, architecture, container runtime, browser when relevant, and reverse proxy.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: text
