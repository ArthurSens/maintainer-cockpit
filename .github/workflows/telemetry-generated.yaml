name: Telemetry generated artifacts

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Registry matches generated artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Set up OpenTelemetry Weaver
        uses: open-telemetry/weaver/.github/actions/setup-weaver@38befce4bc68fe320d20f189465c93835ac20c12 # v0.26.1
        with:
          version: "0.26.1"

      - name: Regenerate telemetry artifacts
        run: make telemetry-generate

      - name: Verify generated artifacts are committed
        run: |
          git diff --exit-code -- \
            internal/telemetry/metric_names_generated.go \
            docs/generated-telemetry.md \
            examples/otel-lgtm/grafana/dashboards/maintainer-cockpit-genai.json
