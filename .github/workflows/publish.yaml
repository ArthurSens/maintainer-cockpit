name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish-image:
    name: Publish signed multi-platform image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.names.outputs.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set image and version names
        id: names
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "image=ghcr.io/${REPOSITORY,,}"
            echo "version=${REF_NAME}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "${GITHUB_OUTPUT}"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.image }}:${{ steps.names.outputs.version }}
          build-args: |
            VERSION=${{ steps.names.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.names.outputs.build_date }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.names.outputs.version }}
          provenance: mode=max
          sbom: true
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image by digest
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  release:
    name: Publish GitHub release
    needs: publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build Linux release archives
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for arch in amd64 arm64; do
            directory="maintainer-cockpit_${TAG}_linux_${arch}"
            mkdir -p "dist/${directory}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build \
              -trimpath \
              -ldflags="-s -w -X main.version=${TAG} -X main.commit=${COMMIT} -X main.buildDate=${build_date}" \
              -o "dist/${directory}/maintainer-cockpit" \
              ./cmd/maintainer-cockpit
            if [[ "${arch}" == "amd64" ]]; then
              [[ "$("dist/${directory}/maintainer-cockpit" version --short)" == "${TAG}" ]]
            fi
            cp LICENSE README.md "dist/${directory}/"
            tar -C dist -czf "dist/${directory}.tar.gz" "${directory}"
            rm -rf "dist/${directory}"
          done
          go run ./cmd/config-schema > dist/maintainer-cockpit.schema.json
          printf '%s@%s\n' \
            '${{ needs.publish-image.outputs.image }}' \
            '${{ needs.publish-image.outputs.digest }}' \
            > dist/image-digest.txt
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/maintainer-cockpit.spdx.json
          syft-version: v1.51.1
          upload-artifact: false
          upload-release-assets: false
      - name: Generate release checksums
        run: |
          (
            cd dist
            sha256sum \
              image-digest.txt \
              maintainer-cockpit.schema.json \
              maintainer-cockpit.spdx.json \
              ./*.tar.gz > checksums.txt
          )
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign release checksums
        run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" \
            --verify-tag \
            --title "Maintainer Cockpit ${TAG}" \
            --generate-notes \
            dist/*
