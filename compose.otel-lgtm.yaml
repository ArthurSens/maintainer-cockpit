services:
  app:
    depends_on:
      - lgtm
    environment:
      OTEL_CONFIG_FILE: /etc/maintainer-cockpit/otel-sdk.yaml
    volumes:
      - ./examples/otel-lgtm/otel-sdk.yaml:/etc/maintainer-cockpit/otel-sdk.yaml:ro

  lgtm:
    image: grafana/otel-lgtm:0.32.1@sha256:7fd8eaad6bb64897ad5f644c8e15ee67c3204c97168f4bdba122adbf8f60e3c4
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - lgtm-data:/data
      - ./examples/otel-lgtm/grafana/provisioning/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/maintainer-cockpit.yaml:ro
      - ./examples/otel-lgtm/grafana/dashboards:/var/lib/grafana/dashboards/maintainer-cockpit:ro
    restart: unless-stopped

volumes:
  lgtm-data:
